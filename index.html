  }
  function copyLink() {
    try {
      navigator.clipboard.writeText(SHARE_URL).then(function () { state.copied = true; render(); }, function () {});
    } catch (x) {}
  }
  document.addEventListener('submit', function (ev) {
    var f = ev.target.closest('form[data-form="contact"]');
    if (!f) return;
    ev.preventDefault();
    var d = new FormData(f);
    var body = ['Нэр: ' + (d.get('name') || ''), 'Утас: ' + (d.get('phone') || ''), 'Хэн: ' + (d.get('type') || ''), '', (d.get('message') || '')].join('\n');
    location.href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('Magic Cell — хүсэлт') + '&body=' + encodeURIComponent(body);
  });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-lang],[data-action]');
    if (!b) return;
    if (b.dataset.lang) { state.lang = b.dataset.lang; state.copied = false; render(); return; }
    if (b.dataset.action === 'copy') copyLink();
    if (b.dataset.action === 'share') {
      var t = I18N[state.lang];
      if (navigator.share) navigator.share({title: t.shareSubject, url: SHARE_URL}).catch(function () {});
      else copyLink();
    }
  });
  render();
})();
</script>
